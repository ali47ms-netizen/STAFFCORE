
name: Build STAFFCORE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "STAFFCORE-PROJECT-UPDATED.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract STAFFCORE project
        run: |
          unzip STAFFCORE-PROJECT-UPDATED.zip
          cd STAFFCORE-Apps/android
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd STAFFCORE-Apps/android/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STAFFCORE-APK
          path: STAFFCORE-Apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          
